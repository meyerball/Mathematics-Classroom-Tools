<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Mathematics Hub | meyerball</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      line-height: 1.5;
    }

    header {
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand-badge {
      display: inline-block;
      font-family: monospace;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent-purple);
      background: rgba(192, 132, 252, 0.1);
      border: 1px solid rgba(192, 132, 252, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #38bdf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      list-style: none;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      background: var(--card-hover);
      border-color: #475569;
      box-shadow: 0 12px 24px -10px rgba(56, 189, 248, 0.2);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .icon-box {
      font-size: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue);
      padding: 4px 10px;
      border-radius: 9999px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .btn-action {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card:hover .btn-action {
      color: var(--accent-purple);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-badge">&lt;meyerball /&gt;</div>
    <h1>Senior Mathematics Hub</h1>
    <p class="subtitle">Interactive tools & practice arcades for Years 11 & 12.</p>
  </header>

  <div id="tool-list" class="grid">Loading activities...</div>

  <script>
    fetch('https://api.github.com/repos/meyerball/Year-11-Classroom-Tools/contents/')
      .then(res => res.json())
      .then(files => {
        const container = document.getElementById('tool-list');
        container.innerHTML = '';
        
        files.forEach(file => {
          if (file.name.endsWith('.html') && file.name !== 'index.html') {
            let cleanName = file.name.replace('.html', '').replace(/_/g, ' ');
            cleanName = cleanName.replace(/\b\w/g, l => l.toUpperCase());

            // Choose an icon dynamically based on the filename
            let icon = '🎮';
            if (file.name.includes('adv')) icon = '⚡';
            if (file.name.includes('standard')) icon = '🎯';
            if (file.name.includes('calc')) icon = '🧮';

            const card = document.createElement('a');
            card.className = 'card';
            card.href = file.name;
            card.innerHTML = `
              <div>
                <div class="card-header">
                  <span class="icon-box">${icon}</span>
                  <span class="badge">Interactive Activity</span>
                </div>
                <h2 class="card-title">${cleanName}</h2>
              </div>
              <div class="btn-action">Launch Arcade &rarr;</div>
            `;
            container.appendChild(card);
          }
        });
      });
  </script>

</body>
</html>
